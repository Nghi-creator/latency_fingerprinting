[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "latency-fingerprinting"
version = "0.1.0"
description = "Interpretable perturbation-response fingerprinting for latency diagnosis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.1,<3",
  "pydantic>=2.10,<3",
]

[project.scripts]
latency-fingerprint = "latency_fingerprinting.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/latency_fingerprinting"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["latency_fingerprinting"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
